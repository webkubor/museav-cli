stages:
  - validate
  - build
  - notify

variables:
  NODE_VERSION: "22"
  CI: "true"

default:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

install:
  stage: .pre
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

type-check:
  stage: validate
  script:
    - pnpm tsc --noEmit
  needs: [install]

lint:
  stage: validate
  script:
    - pnpm eslint --max-warnings 0
  needs: [install]

format:
  stage: validate
  script:
    - pnpm prettier --check .
  needs: [install]

# 设计 token 锁：只拦「改动行新增的裸值」，存量不挡（见 DESIGN.md）
# - CSS：color/bg/fill/stroke/border-radius/font-family 裸值
# - TSX：inline style 里的裸 hex（共享 eslint 的盲区）
design-tokens:
  stage: validate
  script:
    - apk add --no-cache git
    - git fetch --depth=50 origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}" || true
    - pnpm lint:css:diff "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
    - pnpm lint:style:diff "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
  needs: [install]

build:test:
  stage: build
  script:
    - pnpm build:test
  needs: [type-check, lint, format]
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - dev
    - merge_requests

build:production:
  stage: build
  script:
    - pnpm build:production
  needs: [type-check, lint, format]
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  only:
    - main

# qa#109: push the FE-owned nav.ts menu catalog to the backend on every main
# build so 运营后台 always manages the latest menus. The backend upserts by key
# (never hard-deletes), so this is idempotent and safe to re-run. Non-blocking
# (allow_failure) — a sync hiccup must not fail a release; the next build re-syncs.
# MENUS_API_BASE defaults to the test web-api host in scripts/sync-menus.ts;
# override the CI variable to target another environment.
sync:menus:
  stage: notify
  script:
    - pnpm sync:menus
  needs: [build:production]
  allow_failure: true
  only:
    - main

notify:feishu:
  stage: notify
  image: python:3-alpine
  before_script: []
  script:
    - |
      python3 << 'PYEOF'
      import json, os, urllib.request

      sha     = os.environ.get("CI_COMMIT_SHA", "")[:8]
      title   = os.environ.get("CI_COMMIT_TITLE", "")[:100]
      author  = os.environ.get("GITLAB_USER_NAME", "unknown")
      branch  = os.environ.get("CI_COMMIT_BRANCH", "main")
      proj    = os.environ.get("CI_PROJECT_URL", "")
      full_sha = os.environ.get("CI_COMMIT_SHA", "")
      pipeline = os.environ.get("CI_PIPELINE_URL", "")

      payload = {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "🚀 modelgo-console-web · main 有新提交"},
            "template": "blue"
          },
          "elements": [
            {
              "tag": "div",
              "fields": [
                {"is_short": True, "text": {"tag": "lark_md", "content": f"**作者**\n{author}"}},
                {"is_short": True, "text": {"tag": "lark_md", "content": f"**分支**\n{branch}"}}
              ]
            },
            {
              "tag": "div",
              "text": {"tag": "lark_md", "content": f"**提交信息**\n`{sha}` {title}"}
            },
            {
              "tag": "action",
              "actions": [
                {"tag": "button", "text": {"tag": "plain_text", "content": "查看 Commit"}, "url": f"{proj}/-/commit/{full_sha}", "type": "default"},
                {"tag": "button", "text": {"tag": "plain_text", "content": "查看 Pipeline"}, "url": pipeline, "type": "default"}
              ]
            }
          ]
        }
      }

      req = urllib.request.Request(
        "https://open.feishu.cn/open-apis/bot/v2/hook/cff556f8-0c7c-49e6-8fcf-f770851088ad",
        json.dumps(payload).encode(),
        {"Content-Type": "application/json"},
        method="POST"
      )
      with urllib.request.urlopen(req) as r:
        print(r.read().decode())
      PYEOF
  needs: [build:production]
  when: always
  only:
    - main
