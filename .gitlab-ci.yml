# MUSE AV CLI —— GitLab CI（只做检查，不发版）
#
# 🔴 发版链路不在这里，在 GitHub Actions（.github/workflows/publish.yml）。
#
# 2026-11-14 迁过一次、两天后又迁回来了，根因值得记下来：
#
#   迁移理由：主仓搬到 gitlab.com/museav/museav-cli，想让「仓库 + 发版」在一处。
#   失败原因：npm 的 Trusted Publishing 带 provenance 发布时，会校验 runner 环境，
#             只认 GitLab 官方托管的 runner（runner_environment = gitlab-hosted）。
#             而本组当前唯一能用的 runner 是自建的 `nanzhu-shanghai-docker`
#             —— 被 npm 判成 "self-hosted"，发布被拒：
#               Error verifying sigstore provenance bundle: Unsupported GitLab CI
#               runner environment: "self-hosted". Only "gitlab-hosted" runners
#               are supported when publishing with provenance.
#             退一步用 GitLab 官方共享 runner（gitlab-org / saas-linux-*）也不行：
#             museav 命名空间的共享 runner 分钟配额已用尽，job 直接起不来
#             （ci_quota_exceeded）。OIDC 换凭证和 provenance 签名本身都是通的，
#             卡的就是「跑在哪种 runner 上」这一条。
#
#   GitHub 这边没有这个问题：Actions 的 ubuntu-latest 是托管 runner，
#   公开仓库分钟额度不限，npm 上那条 trusted publisher 也一直绑着它。
#
# 所以定成：**主仓在 GitLab（开发、MR、代码都在这），发版走 GitHub Actions。**
# 两边推同一个 commit，main 保持一致。
#
# 本文件只跑检查（typecheck / build / test），与 GitHub 的 ci.yml 职责相同。
# 真正发版的只有 .github/workflows/publish.yml 一条路，避免两套都能发版、迟早发错地方。

stages:
  - build

variables:
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"

build:
  stage: build
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npx tsc --noEmit
    - npm run build
    - npm test
