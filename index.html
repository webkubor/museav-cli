<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/modelgo-app-icon-dark.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/brand/modelgo-app-icon-light.svg" media="(prefers-color-scheme: dark)" />
    <!-- Apple 设备「添加到主屏幕」用 apple-touch-icon(不认 SVG favicon/manifest);缺失会退化成页面截图=白块(需求方#244) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <title>ModelGo 控制台</title>

    <!-- Google tag (gtag.js)：对外门户统一接入 GA4 埋点上报（属性 G-WCEKH5ZZEH，
         与国内官网 / 国外官网 / 说明文档同一个属性，便于跨站看完整漏斗）。

         控制台虽是登录后的后台，但 /models（模型广场）与 /models/discovery（模型发现）
         未登录可访问，根路径 / 对未登录访客也跳 /models —— 它们是对外页面
         （owner 2026-09-17：只要对外的门户都需要加）。

         与站内 @model-go/track 是两条线：track 报自有后端，这条报 Google。
         别用 track 去封装它，也别把两者的事件名混在一起。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WCEKH5ZZEH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WCEKH5ZZEH');
    </script>
    <script>
      // PWA 下线迁移：历史版本给用户浏览器装过 ServiceWorker，不清会一直由旧 SW
      // 控制页面、吃到过期 precache。页面一加载就注销全部 SW 并清空 Cache Storage，
      // 之后回到纯 HTTP。等线上流量全部换代后，本段可整体删除。
      ;(function () {
        var purge = []
        if ('serviceWorker' in navigator) {
          purge.push(
            navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                return Promise.all(
                  registrations.map(function (registration) {
                    return registration.unregister()
                  }),
                )
              })
              .catch(function () {}),
          )
        }
        if ('caches' in window) {
          purge.push(
            caches
              .keys()
              .then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key) }))
              })
              .catch(function () {}),
          )
        }
        Promise.all(purge)
      })()
    </script>
    <script>
      // 部署切版本时，旧 HTML 可能继续引用已删除的 /assets/*.js。
      // 一旦服务器把缺失 chunk fallback 成 index.html，浏览器会因 MIME text/html 拒绝执行。
      // 资产失效自愈：30s 节流硬刷新(带 sessionStorage 标记防循环)。
      ;(function () {
        var reloadKey = 'mg:asset-reload-ts'
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            var src = target && target.tagName === 'SCRIPT' ? target.src : ''
            if (!src || src.indexOf('/assets/') === -1 || !/\.js($|\?)/.test(src)) return

            var last = Number(sessionStorage.getItem(reloadKey) || '0')
            if (Date.now() - last <= 30000) return
            sessionStorage.setItem(reloadKey, String(Date.now()))
            window.location.reload()
          },
          true,
        )
      })()
    </script>
    <script>
      // 市场前置(域名秒定,渲染前执行零闪烁):国际站(.ai)切 title/favicon/lang。
      // 单一构建产物供 prod/prod-global 两条发布线共用;test/localhost 默认国内,运行时可切。
      ;(function () {
        if (!location.hostname.toLowerCase().endsWith('modelgo.ai')) return
        document.title = 'ModelGo Console'
        document.documentElement.lang = 'en'
        document.querySelectorAll('link[rel="icon"]').forEach(function (l) {
          l.href = '/brand/modelgo-global-logo.svg'
          l.removeAttribute('media') // 国际标自带配色,明暗主题共用一份
        })
        // apple-touch-icon 也随市场:国内靛紫(默认),国际翠绿
        var at = document.querySelector('link[rel="apple-touch-icon"]')
        if (at) at.href = '/brand/apple-touch-icon-global.png'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
