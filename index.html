<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/modelgo-app-icon-dark.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/brand/modelgo-app-icon-light.svg" media="(prefers-color-scheme: dark)" />
    <!-- Apple 设备「添加到主屏幕」用 apple-touch-icon(不认 SVG favicon/manifest);缺失会退化成页面截图=白块(需求方#244) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <title>ModelGo 控制台</title>
    <script>
      // 部署切版本时，旧 HTML 可能继续引用已删除的 /assets/*.js。
      // 一旦服务器把缺失 chunk fallback 成 index.html，浏览器会因 MIME text/html 拒绝执行。
      ;(function () {
        var reloadKey = 'mg:asset-reload-ts'
        var clearRuntimeCaches = function () {
          var tasks = []
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (registrations) {
                  return Promise.all(
                    registrations.map(function (registration) {
                      return registration.unregister()
                    }),
                  )
                })
                .catch(function () {}),
            )
          }
          if ('caches' in window) {
            tasks.push(
              caches
                .keys()
                .then(function (keys) {
                  return Promise.all(keys.map(function (key) { return caches.delete(key) }))
                })
                .catch(function () {}),
            )
          }
          return Promise.all(tasks)
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            var src = target && target.tagName === 'SCRIPT' ? target.src : ''
            if (!src || src.indexOf('/assets/') === -1 || !/\.js($|\?)/.test(src)) return

            var last = Number(sessionStorage.getItem(reloadKey) || '0')
            if (Date.now() - last <= 30000) return
            sessionStorage.setItem(reloadKey, String(Date.now()))
            clearRuntimeCaches().finally(function () {
              window.location.reload()
            })
          },
          true,
        )
      })()
    </script>
    <script>
      // 市场前置(域名秒定,渲染前执行零闪烁):国际站(.ai)切 title/favicon/lang。
      // 单一构建产物供 prod/prod-global 两条发布线共用;test/localhost 默认国内,运行时可切。
      ;(function () {
        if (!location.hostname.toLowerCase().endsWith('modelgo.ai')) return
        document.title = 'ModelGo Console'
        document.documentElement.lang = 'en'
        document.querySelectorAll('link[rel="icon"]').forEach(function (l) {
          l.href = '/brand/modelgo-global-logo.svg'
          l.removeAttribute('media') // 国际标自带配色,明暗主题共用一份
        })
        // apple-touch-icon 也随市场:国内靛紫(默认),国际翠绿
        var at = document.querySelector('link[rel="apple-touch-icon"]')
        if (at) at.href = '/brand/apple-touch-icon-global.png'
        // PWA 安装图标/名称同样随市场:构建注入的 manifest link 在本脚本之后,
        // DOMContentLoaded 后把它切到国际版 manifest(浏览器按需拉取,不早于此)
        window.addEventListener('DOMContentLoaded', function () {
          var m = document.querySelector('link[rel="manifest"]')
          if (m) m.href = '/manifest-global.webmanifest'
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
